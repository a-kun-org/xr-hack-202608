<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>札幌駅発・信号待ち込み最速徒歩ルート</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside class="panel">
        <h1>信号待ち込み<br />最速徒歩ルート</h1>
        <p class="lead">
          札幌駅から、地図をタップした地点まで。歩行時間と信号の予想待ちを足した所要時間が最短のルートを探します。
        </p>
        <dl class="meta">
          <div>
            <dt>起点</dt>
            <dd>札幌駅</dd>
          </div>
          <div>
            <dt>終点</dt>
            <dd id="dest-label">地図をタップして指定</dd>
          </div>
        </dl>
        <p id="status" class="status" role="status"></p>
        <button id="search-btn" type="button" disabled>ルート検索</button>
        <section id="result" class="result" hidden>
          <h2>結果</h2>
          <ul>
            <li>総所要時間 <strong id="r-total">—</strong></li>
            <li>歩行時間 <strong id="r-walk">—</strong></li>
            <li>予想信号待ち <strong id="r-wait">—</strong></li>
            <li>通過信号数 <strong id="r-signals">—</strong></li>
          </ul>
          <p class="note">
            待ち時間は JARTIC 交差点制御情報のサイクル長から、ランダム到着を仮定した予想値です（リアルタイム現示ではありません）。
          </p>
        </section>
      </aside>
      <div id="map"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
