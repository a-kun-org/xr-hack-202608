<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XR Hack 2026.08</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e8eef4;
      --muted: #8b9aab;
      --accent: #3dd6c3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, #1a3a3a 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 80%, #1a2a4a 0%, transparent 45%),
        var(--bg);
      padding: 2rem;
    }

    main {
      text-align: center;
      max-width: 28rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>XR Hack <span>2026.08</span></h1>
    <p>GitHub Pages で公開中の簡易ページです。</p>
  </main>
</body>
</html>
